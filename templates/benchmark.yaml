id: daily-work-item-readiness
version: 1.0.0
flow_id: daily-workflow

criteria:
  - id: objective_defined
    description: Mục tiêu công việc được mô tả rõ.
    severity: blocker
    evidence_paths:
      - intake.objective
    evaluator:
      kind: non_empty
    missing_evidence: UNKNOWN

  - id: acceptance_testable
    description: Có ít nhất một acceptance criterion kiểm chứng được.
    severity: blocker
    evidence_paths:
      - intake.acceptance_criteria
    evaluator:
      kind: non_empty_list
    missing_evidence: UNKNOWN

  - id: repository_known
    description: Repository và base branch được xác định.
    severity: blocker
    evidence_paths:
      - run.repository.path
      - run.repository.base_branch
    evaluator:
      kind: all_non_empty
    missing_evidence: FAIL

  - id: conflicts_resolved
    description: Không còn mâu thuẫn requirement chưa xử lý.
    severity: blocker
    evidence_paths:
      - intake.conflicts
    evaluator:
      kind: empty_list
    missing_evidence: UNKNOWN
